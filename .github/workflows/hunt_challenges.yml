name: 🏹 Cazador de Retos IA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout del blog
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏹 Ejecutar Cacería de Retos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/hunt_challenges.py

      - name: 📝 Commit y Push de los nuevos MDX
        run: |
          if ls src/content/auto-challenges/*.mdx 2>/dev/null; then
            git config user.name jorbencas
            git config user.email jorbencas@gmail.com
            git add src/content/auto-challenges/*.mdx
            git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 IA: Nuevos retos de programación generados" && git push)
          else
            echo "No hay retos nuevos que añadir"
          fi
