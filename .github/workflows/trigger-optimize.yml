name: 🖼️ Disparar optimización de imágenes
on:
  push:
    branches: [main]
    paths:
      - "public/img/**"
      - "src/content/**/*.mdx"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar optimize en test_githubActions
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }} 
        run: |
          gh api repos/jorbencas/test_githubActions/dispatches \
            -f event_type='optimize-images'
