name: 🖼️ Disparar optimización de imágenes
on:
  push:
    branches: [main]
    paths:
      - "public/img/**"
      - "src/content/**/*.mdx"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar optimize en test_githubActions
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/jorbencas/test_githubActions/dispatches \
            -d '{"event_type":"optimize-images"}'
