name: Lint MDX

on:
  push:
    paths:
      - "src/content/**/*.mdx"
  pull_request:
    paths:
      - "src/content/**/*.mdx"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Lint & fix MDX syntax
        run: node scripts/lint-mdx.mjs --fix

      - name: Commit fixes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: auto-fix MDX syntax issues"
            git push
          fi
