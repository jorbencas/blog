name: Fix Auto-News Images
 
on:
  push:
    paths:
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'
  workflow_dispatch:

jobs:
  fix-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow aiohttp requests pillow-avif-plugin

      - name: Run Image Fixer
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/fix_images.py

      - name: Debug output
        run: |
          echo "📂 IMG:"
          ls -R public/img || true
          echo "📂 CONTENT:"
          ls -R src/content || true

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: auto-repair images"
          file_pattern: |
            src/content/**/*.md*
            public/img/**
            image_cache.json
